  <div class="app-shell" id="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">SW</div>
        <div class="brand-text">
          <div class="brand-name">SoulWine</div>
          <div class="brand-sub">Operations</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-foot">
        <button class="sidebar-help" type="button" data-action="open-help">
          <svg class="icon"><use href="#i-help"></use></svg>
          <span>Trợ giúp &amp; hướng dẫn</span>
        </button>
        <div class="sidebar-version">SoulWine Operations</div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Mở hoặc thu gọn menu">
          <svg class="icon"><use href="#i-menu"></use></svg>
        </button>
        <button class="search-trigger" id="search-trigger" aria-label="Tìm kiếm toàn cục">
          <svg class="icon"><use href="#i-search"></use></svg>
          <span>Tìm đơn hàng, khách hàng, SKU…</span>
          <kbd>/</kbd>
        </button>
        <div class="topbar-actions">
          <button class="save-status" id="save-status" data-action="storage-details" type="button" aria-live="polite">Đang mở dữ liệu…</button>
          <button class="btn btn-primary quick-btn" id="quick-btn" aria-label="Tạo mới">
            <svg class="icon"><use href="#i-plus"></use></svg>
            <span>Tạo mới</span>
          </button>
          <button class="icon-btn has-badge" id="notif-btn" aria-label="Thông báo">
            <svg class="icon"><use href="#i-bell"></use></svg>
            <span class="count-badge" id="notif-count">0</span>
          </button>
          <div class="topbar-divider"></div>
          <button class="role-switch" id="role-btn" aria-label="Tài khoản và vai trò">
            <span class="avatar" id="user-initials">NQ</span>
            <span class="role-switch-text">
              <strong id="user-role">Giám đốc</strong>
              <small id="user-name">Nguyễn Như Quỳnh</small>
            </span>
            <svg class="icon chevron"><use href="#i-chevron-down"></use></svg>
          </button>
        </div>
      </header>
      <div id="workspace-notices" aria-live="polite"></div>
      <main class="app-content" id="view" tabindex="-1"><div class="page-skeleton" aria-busy="true" aria-label="Đang mở không gian làm việc"><div></div><div></div><div></div></div></main>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div id="popover-root"></div>
  <div id="overlay-root"></div>
  <div id="drawer-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <div class="search-overlay hidden" id="search-overlay">
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Tìm kiếm toàn cục">
      <div class="search-panel-head">
        <svg class="icon"><use href="#i-search"></use></svg>
        <input type="search" id="search-input" placeholder="Tìm đơn hàng, báo giá, hợp đồng, khách hàng, SKU…" autocomplete="off">
        <button class="icon-btn" id="search-close" aria-label="Đóng tìm kiếm">
          <svg class="icon"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="search-results" id="search-results"></div>
      <div class="search-panel-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> di chuyển</span>
        <span><kbd>Enter</kbd> mở</span>
        <span><kbd>Esc</kbd> đóng</span>
      </div>
    </div>
  </div>

  <div class="login-screen hidden" id="login-screen"></div>
  <noscript><div class="noscript-notice">SoulWine cần JavaScript để mở không gian làm việc. Bật JavaScript trong cài đặt trình duyệt rồi tải lại trang.</div></noscript>
